description: >-
  Air Quality Programmatic APIs provide real-time and forecast air quality data from 11,000+ monitoring stations in
  1,000+ cities worldwide. APIs deliver Air Quality Index (AQI) measurements for PM2.5, PM10, NO2, CO, SO2, and ozone
  pollutants. Provided by AQICN (World Air Quality Index project) in partnership with the US EPA and global
  environmental agencies. Data is available via JSON API and map tile API for visualization.
